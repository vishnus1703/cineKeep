<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineKeep - Sign In</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="min-h-screen w-full flex bg-[#0f172a] text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Brand Sidebar Showcase Hero Area -->
    <div class="hidden lg:flex lg:w-1/2 relative items-center justify-center bg-cover bg-center overflow-hidden" 
         style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1025&auto=format&fit=crop');">
        
        <div class="absolute inset-0 bg-gradient-to-tr from-[#0f172a] via-[#0f172a]/80 to-transparent z-10"></div>
        <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-indigo-600/20 rounded-full blur-3xl z-0 animate-pulse"></div>
        
        <div class="relative z-20 max-w-md p-8 text-left">
            <div class="flex items-center gap-3 mb-6">
                <div class="p-3 bg-indigo-600 rounded-2xl shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-film text-xl text-white"></i>
                </div>
                <span class="text-2xl font-bold tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">CineKeep</span>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight leading-tight mb-4">
                Welcome Back to Your <br>
                <span class="bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Movie Sanctuary.</span>
            </h1>
            <p class="text-slate-400 text-lg font-light leading-relaxed">
                Sign in to manage your watchlists, access your personal favorites, and continue your cinematic journey.
            </p>
        </div>
    </div>

    <!-- Login Interface Form Area -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 md:p-16 bg-[#090d16]">
        <div class="w-full max-w-md space-y-8">
            
            <div class="text-center lg:text-left">
                <h2 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h2>
                <p class="text-sm text-slate-400">Enter your credentials to access your collections.</p>
            </div>

            <form id="loginForm" class="space-y-6">
                
                <!-- Username Input Field Block (Synchronized text label to prevent backend errors) -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Username</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                            <i class="fa-regular fa-user text-lg"></i>
                        </div>
                        <input
                            type="text"
                            id="email"
                            required
                            placeholder="Enter your username"
                            class="w-full pl-12 pr-4 py-3.5 bg-[#131a2a] border border-slate-800 rounded-xl text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200"
                        >
                    </div>
                </div>

                <!-- Password Input Field Block -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                        <span class="text-xs text-indigo-400 hover:underline cursor-pointer">Forgot password?</span>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                            <i class="fa-solid fa-lock text-lg"></i>
                        </div>
                        <input
                            type="password"
                            id="password"
                            required
                            placeholder="••••••••"
                            class="w-full pl-12 pr-12 py-3.5 bg-[#131a2a] border border-slate-800 rounded-xl text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200"
                        >
                        <!-- Dynamic Eye Toggle Trigger -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300 transition-colors"
                        >
                            <i id="eyeIcon" class="fa-regular fa-eye text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Device Option -->
                <div class="flex items-center">
                    <input
                        id="rememberMe"
                        type="checkbox"
                        class="w-4 h-4 rounded bg-[#131a2a] border-slate-800 text-indigo-600 focus:ring-indigo-500/20 focus:ring-offset-0 accent-indigo-600 cursor-pointer"
                    >
                    <label for="rememberMe" class="ml-2 text-sm text-slate-400 cursor-pointer select-none">
                        Remember this device
                    </label>
                </div>

                <!-- Submission Button -->
                <button
                    type="submit"
                    class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[#090d16] transform active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer"
                >
                    Sign In
                </button>
            </form>

            <p class="text-center text-sm text-slate-500">
                New to CineKeep? 
                <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors ml-1">
                    Create an account
                </a>
            </p>

        </div>
    </div>

    <!-- Script Routing Hook Module Location -->
    <script src="js/login.js"></script>
</body>
</html>
