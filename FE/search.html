<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineKeep - Search Results</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link class="main-assets" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-[#040711] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <nav class="sticky top-0 z-40 w-full bg-[#040711]/70 backdrop-blur-xl border-b border-white/[0.04] px-4 lg:px-10 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="window.location.href='dashboard.html'">
            <div class="relative p-2.5 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-2xl shadow-xl shadow-indigo-600/20 group-hover:shadow-indigo-500/40 transition-all duration-300">
                <i class="fa-solid fa-play text-sm text-white pl-0.5"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    Cine<span class="text-indigo-400 drop-shadow-[0_0_12px_rgba(129,140,248,0.5)]">Keep</span>
                </span>
                <span class="text-[10px] text-indigo-400/60 uppercase tracking-widest font-bold -mt-1">Premium Lounge</span>
            </div>
        </div>

        <div class="hidden md:flex flex-col items-center w-full max-w-lg mx-12 relative group">
            <div class="w-full relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                <input 
                    id="searchInput"
                    type="text" 
                    placeholder="Refine search queries..." 
                    class="w-full bg-white/[0.03] border border-white/[0.06] rounded-2xl pl-11 pr-12 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500/80 focus:bg-white/[0.05] focus:ring-4 focus:ring-indigo-500/10 transition-all duration-300"
                    autocomplete="off"
                >
            </div>
        </div>

        <div class="flex items-center gap-5">
            <div class="relative text-slate-400 hover:text-white transition-all duration-200 flex items-center justify-center p-2 rounded-xl group/favHead cursor-pointer" onclick="window.location.href='dashboard.html?tab=favorites'">
                <i class="fa-solid fa-heart text-lg text-slate-400 group-hover/favHead:text-rose-400 transition-colors filter group-hover/favHead:drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]"></i>
                <span id="headerFavoriteCount" class="absolute -top-1 -right-1 bg-gradient-to-r from-rose-500 to-pink-500 text-[9px] text-white font-black w-4 h-4 rounded-full flex items-center justify-center border border-[#040711] shadow-lg shadow-rose-500/20">0</span>
            </div>

            <div class="relative text-slate-400 hover:text-white transition-all duration-200 flex items-center justify-center p-2 rounded-xl group/watch cursor-pointer" onclick="window.location.href='dashboard.html?tab=watchlist'">
                <i class="fa-solid fa-bookmark text-lg text-slate-400 group-hover/watch:text-indigo-400 transition-colors filter group-hover/watch:drop-shadow-[0_0_8px_rgba(129,140,248,0.6)]"></i>
                <span id="headerWatchlistCount" class="absolute -top-1 -right-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-[9px] text-white font-black w-4 h-4 rounded-full flex items-center justify-center border border-[#040711] shadow-lg shadow-indigo-500/20">0</span>
            </div>

            <button class="text-slate-400 hover:text-white transition-colors text-lg focus:outline-none cursor-pointer" onclick="window.location.href='dashboard.html'" title="Back to Dashboard">
                <i class="fa-solid fa-house"></i>
            </button>
        </div>
    </nav>

    <div class="w-full flex">
        <main class="flex-1 p-4 lg:p-8 space-y-12 overflow-x-hidden">
            <section class="space-y-6">
                <div class="flex items-center justify-between border-b border-white/[0.04] pb-4">
                    <div class="flex items-center gap-2">
                        <div class="w-1 h-5 bg-gradient-to-b from-indigo-500 to-purple-500 rounded-full"></div>
                        <h3 class="text-xl font-bold text-white tracking-tight" id="searchHeaderTitle">Targeting Search Queries...</h3>
                    </div>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-5 2xl:grid-cols-6 gap-6" id="movieGrid">
                    </div>
            </section>
        </main>
    </div>

    <div id="detailDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[450px] bg-[#090d16]/95 backdrop-blur-2xl border-l border-white/[0.05] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-out p-6 flex flex-col justify-between hidden">
        <div class="space-y-6">
            <div class="flex items-center justify-between border-b border-white/[0.04] pb-4">
                <span class="text-xs uppercase font-extrabold tracking-widest text-indigo-400">Quick Preview</span>
                <button onclick="closeDetailDrawer()" class="text-slate-400 hover:text-white transition-colors text-lg focus:outline-none cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-900 shadow-xl border border-white/10">
                <img id="drawerImage" src="" class="w-full h-full object-cover" alt="context poster">
                <div class="absolute inset-0 bg-gradient-to-t from-[#090d16] to-transparent"></div>
            </div>
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <h3 id="drawerTitle" class="text-2xl font-bold text-white tracking-tight">Movie Title</h3>
                    <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/20 px-2 py-1 rounded-lg text-amber-400 text-xs font-bold">
                        <i class="fa-solid fa-star"></i> <span id="drawerRating">0.0</span>
                    </div>
                </div>
                <p id="drawerYear" class="text-xs font-bold text-slate-500">2026</p>
                
                <div class="flex gap-2 pt-2">
                    <button id="drawerWatchlistBtn" class="px-3 py-1.5 bg-white/5 border border-white/10 text-[11px] font-bold rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition-all flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-regular fa-bookmark"></i> Add to Watchlist
                    </button>
                    <button id="drawerFavoriteBtn" class="px-3 py-1.5 bg-white/5 border border-white/10 text-[11px] font-bold rounded-lg text-slate-300 hover:text-rose-400 hover:bg-white/10 transition-all flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-regular fa-heart"></i> Favorite
                    </button>
                </div>
                
                <p id="drawerDesc" class="text-sm text-slate-200 font-light leading-relaxed pt-2">Detailed synopsis mapping details fetched over API hooks directly.</p>
            </div>
        </div>
        <div class="border-t border-white/[0.04] pt-4 flex gap-3">
            <button onclick="closeDetailDrawer()" class="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-bold transition-all active:scale-[0.99] cursor-pointer">Back to Results</button>
        </div>
    </div>

    <script src="js/search.js"></script>
</body>
</html>
