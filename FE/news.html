<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineKeep - Hollywood News Wire</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="min-h-screen bg-[#040711] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- Sticky Navigation Frame Header -->
    <nav class="sticky top-0 z-40 w-full bg-[#040711]/70 backdrop-blur-xl border-b border-white/[0.04] px-4 lg:px-10 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="window.location.href='dashboard.html'">
            <div class="relative p-2.5 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-2xl shadow-xl shadow-indigo-600/20 group-hover:shadow-indigo-500/40 transition-all duration-300">
                <i class="fa-solid fa-play text-sm text-white pl-0.5"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    Cine<span class="text-indigo-400 drop-shadow-[0_0_12px_rgba(129,140,248,0.5)]">Keep</span>
                </span>
                <span class="text-[10px] text-indigo-400/60 uppercase tracking-widest font-bold -mt-1">News Terminal</span>
            </div>
        </div>

        <button onclick="window.location.href='dashboard.html'" class="px-4 py-2.5 bg-white/[0.03] border border-white/[0.08] text-xs font-bold rounded-xl text-slate-300 hover:text-white hover:bg-white/[0.06] transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </button>
    </nav>

    <!-- Main Workspace Container -->
    <main class="max-w-6xl mx-auto p-4 lg:p-10 space-y-12">
        
        <!-- Header Text Block -->
        <div class="space-y-2 border-b border-white/[0.04] pb-6">
            <div class="flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_#10b981]"></span>
                <span class="text-[10px] uppercase font-black tracking-widest text-emerald-400">Live Industry Wire Feed</span>
            </div>
            <h1 class="text-3xl lg:text-5xl font-extrabold tracking-tight text-white">Hollywood Press Releases</h1>
            <p class="text-slate-400 text-sm max-w-xl">Real-time studio logs, production reveals, breaking announcements, and major slate transformations across globally monitored projects.</p>
        </div>

        <!-- News Grid Display Target -->
        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Loading Shell State placeholder -->
            <div class="col-span-full py-20 text-center text-slate-500 text-sm">
                <i class="fa-solid fa-circle-notch fa-spin mr-2 text-indigo-400"></i> Syncing Live Production Wire Logs...
            </div>
        </div>

    </main>

    <!-- Embedded News Content Pipeline Controller Engine -->
    <script>
        const BASE_URL = "https://api.themoviedb.org/3";
        const BACKDROP_BASE_URL = "https://image.tmdb.org/t/p/w1280";
        
        const apiOptions = {
            method: 'GET',
            headers: {
                accept: 'application/json',
                Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzMjdlMjViZGUyOTE1MTFhNDJhYzBhMzQ2YWZiY2U2YSIsIm5iZiI6MTc4MDU5NzQwNS40MDgsInN1YiI6IjZhMjFjMjlkNTRhZTc0NTdjZTgwMDBmMCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.I4W1JWV3DPIVUAv0WHD-iGMnBoa_c9ntxlyhGosZCV4'
            }
        };

        document.addEventListener('DOMContentLoaded', fetchRealTimeNewsWire);

        async function fetchRealTimeNewsWire() {
            const newsGrid = document.getElementById('newsGrid');
            if (!newsGrid) return;

            try {
                // Dynamically queries the hot movie tracking logs for up-to-date realistic content parameters
                const response = await fetch(`${BASE_URL}/movie/now_playing?language=en-US&page=1`, apiOptions);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    renderNewsWireCards(data.results, newsGrid);
                } else {
                    renderErrorState(newsGrid);
                }
            } catch (error) {
                console.error("News stream fetch failure:", error);
                renderErrorState(newsGrid);
            }
        }

        function renderNewsWireCards(items, container) {
            container.innerHTML = '';
            
            // Premium contextual headline mock parameters mapping arrays
            const hooks = [
                "Production reveals fresh cinematic choices and stylistic direction.",
                "Exclusive: Insiders unpack cast revisions and upcoming tracking metrics.",
                "Studio confirmation signals dynamic runtime adjustments for initial premiere slates.",
                "Behind-The-Scenes: Creative teams secure major location properties for filming.",
                "Box Office Analysis: Projections calculate massive opening margins on tracking lists.",
                "Exclusive Sneak Peak: Early screenings prompt heavy structural buzz across reviewers."
            ];

            items.slice(0, 10).forEach((item, index) => {
                const title = item.title || "Untitled Project Update";
                const overview = item.overview || "Production parameter logs are currently being parsed securely by remote global distribution wire networks.";
                const image = item.backdrop_path ? `${BACKDROP_BASE_URL}${item.backdrop_path}` : 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=800';
                
                // Generates varying premium editorial headlines dynamically matching your dataset indices
                const customHeadline = hooks[index % hooks.length];
                const popularityScore = item.popularity ? Math.round(item.popularity) : '450+';

                const cardHTML = `
                    <div class="group bg-white/[0.01] border border-white/[0.04] rounded-3xl overflow-hidden transition-all duration-300 hover:border-white/[0.12] hover:bg-white/[0.02] flex flex-col justify-between shadow-2xl relative">
                        <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                            <img src="${image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80" alt="">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#040711] via-transparent to-transparent"></div>
                            <span class="absolute top-4 left-4 px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-lg tracking-wider uppercase flex items-center gap-1.5 backdrop-blur-md">
                                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Breaking Press
                            </span>
                        </div>
                        
                        <div class="p-6 space-y-3 flex-1 flex flex-col justify-between">
                            <div class="space-y-2">
                                <p class="text-xs font-bold text-indigo-400 uppercase tracking-wide">${customHeadline}</p>
                                <h2 class="text-xl font-bold text-white tracking-tight group-hover:text-indigo-300 transition-colors duration-300">${title}</h2>
                                <p class="text-slate-400 text-xs font-light leading-relaxed line-clamp-3 pt-1">${overview}</p>
                            </div>
                            
                            <div class="flex items-center justify-between pt-4 border-t border-white/[0.03] mt-4 text-[11px] font-semibold text-slate-500">
                                <span><i class="fa-regular fa-calendar mr-1"></i> June 2026</span>
                                <span class="text-slate-400 bg-white/5 px-2 py-0.5 rounded border border-white/5"><i class="fa-solid fa-users text-[9px] mr-1"></i> ${popularityScore} Reading</span>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function renderErrorState(container) {
            container.innerHTML = `
                <div class="col-span-full py-16 text-center text-xs text-rose-300/80 font-medium">
                    <i class="fa-solid fa-triangle-exclamation mb-2 text-xl text-rose-500 block"></i>
                    Failed to sync live news wire metrics. Check system configurations.
                </div>`;
        }
    </script>
</body>
</html>
